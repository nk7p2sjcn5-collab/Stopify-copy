<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music By Prashes">
<title>Music By Prashes</title>
<style>
:root{color-scheme:dark;--bg:#171014;--panel:#261b21;--accent:#ff2ea6;--muted:#b3a7af}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:145px}
button,input{font:inherit}
button{border:0;cursor:pointer}
header{padding:22px 18px 12px;position:sticky;top:0;background:#171014f2;backdrop-filter:blur(16px);z-index:5}
.brand{font-size:24px;font-weight:800;letter-spacing:-.7px}
.brand span{color:var(--accent)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;color:#13070e;font-weight:800;font-size:16px;display:grid;place-items:center;flex-shrink:0}
header p{color:var(--muted);font-size:13px;margin:5px 0 15px}
.search{width:100%;padding:13px 15px;border-radius:12px;background:#31262d;border:1px solid #42363e;color:white;outline:none}
.actions{display:flex;gap:9px;overflow:auto;padding:14px 0 4px}
.pill{white-space:nowrap;background:#31262d;color:white;border-radius:24px;padding:9px 14px;font-size:13px}
.pill.active{background:var(--accent);color:#13070e;font-weight:700}
main{padding:10px 16px}
h2{font-size:20px;margin:18px 0 12px}
.cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.card{flex:0 0 145px;background:var(--panel);padding:10px;border-radius:13px;text-align:left;color:white}
.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:linear-gradient(135deg,#4e3142,#181217)}
.card strong{display:block;margin-top:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{display:block;color:var(--muted);margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;min-width:0}
.row .cover{width:55px;flex-shrink:0}
.details{flex:1;min-width:0}
.details strong,.details small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.details small{color:var(--muted);margin-top:5px;font-size:12px}
.row .details strong{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;white-space:normal;text-overflow:clip;word-break:break-word;line-height:1.25}
.iconbtn{width:36px;height:40px;background:transparent;color:white;font-size:21px;flex-shrink:0}
.liked{color:var(--accent)!important}
.empty{color:var(--muted);padding:20px 0;font-size:14px;line-height:1.6}
#mini{position:fixed;bottom:65px;left:10px;right:10px;background:#35262f;border-radius:13px;padding:9px;display:none;align-items:center;gap:10px;z-index:10;box-shadow:0 5px 25px #0008}
#mini img{width:45px;height:45px;object-fit:cover;border-radius:7px;background:#111}
#mini .details{cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#171014f7;display:flex;justify-content:space-around;align-items:center;z-index:12;border-top:1px solid #332830}
nav button{background:transparent;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:4px;align-items:center}
nav button span{font-size:21px}
nav button.active{color:var(--accent)}
#now{position:fixed;inset:0;background:linear-gradient(160deg,#3c2432,#171014 55%);z-index:30;display:none;overflow:auto;padding:20px 22px 35px}
.nowtop{display:flex;justify-content:space-between;align-items:center}
.nowcover{width:min(78vw,370px);aspect-ratio:1;object-fit:cover;border-radius:15px;display:block;margin:35px auto 28px;background:#281b23;box-shadow:0 15px 45px #0008}
.nowmeta{display:flex;align-items:center;gap:12px}
.nowmeta .details strong{font-size:22px;white-space:normal;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.2}
.nowmeta .details small{font-size:14px}
.progress{width:100%;accent-color:var(--accent);margin:20px 0 0}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.controls{display:flex;justify-content:space-around;align-items:center;margin:20px 0}
.controls button{background:transparent;color:white;font-size:28px;display:grid;place-items:center}
.controls button svg{display:block}
.controls .play{background:var(--accent);color:#13070e;border-radius:50%;width:65px;height:65px;font-size:27px}
.nowextras{display:flex;justify-content:space-around}
.nowextras button{background:transparent;color:var(--muted);padding:10px}
dialog{background:#2d2028;color:white;border:1px solid #53464f;border-radius:16px;width:calc(100% - 36px);max-width:430px}
dialog::backdrop{background:#000a}
dialog input{width:100%;padding:12px;border-radius:9px;border:1px solid #63535e;background:#1b1117;color:white;margin:8px 0 14px}
.dialogactions{display:flex;gap:10px;justify-content:flex-end}
.primary{background:var(--accent);color:#13070e;padding:10px 15px;border-radius:22px;font-weight:700}
.secondary{background:#473a42;color:white;padding:10px 15px;border-radius:22px}
#toast{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);background:#f7e8f2;color:#201018;padding:10px 16px;border-radius:25px;font-size:13px;z-index:50;display:none;max-width:90%;text-align:center}
.roomcode{font-size:42px;font-weight:800;letter-spacing:8px;color:var(--accent);text-align:center;margin:14px 0;padding:20px 10px;background:#241820;border-radius:14px;border:1px dashed #5b3c4e}
.sharegrid{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.sharebig{background:var(--panel);border-radius:14px;padding:16px;text-align:left;color:white;display:block;width:100%}
.sharebig h3{margin:0 0 6px;font-size:17px}
.sharebig p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.joinrow{display:flex;gap:9px;margin-top:12px}
.joinrow input{flex:1;min-width:0;padding:12px 14px;border-radius:11px;border:1px solid #42363e;background:#1b1117;color:white;font-size:16px;letter-spacing:4px;outline:none}
.guestline{display:flex;align-items:center;gap:10px;padding:8px 0}
#fileInput{display:none}
</style>
</head>

<div id="now">
  <div class="nowtop">

<script>
'use strict';

const DRIVE_FOLDER_ID = '1JV4uVw7BK86UAsYGtyVb8TCpZG4MYr7x';
const DRIVE_API_KEY = 'AIzaSyCOWKZKJXkoiV6FbQfwUVp-u5OzxX0MhKs';
const DB_NAME = 'MyMusicDatabase';

const $ = id => document.getElementById(id);
const audio = $('audio');

let songs = [];
let currentId = null;
let currentView = 'home';
let activePlaylist = null;
let activeAlbum = null;
let playlistEditId = null;
let queue = [];
let queueIndex = -1;
let shuffle = false;
let repeat = false;
let db = null;
let toastTimer;
const objectUrls = new Map();

let users = JSON.parse(localStorage.getItem('mymusic-users') || '[]');
let currentUserId = localStorage.getItem('mymusic-current-user');
let liked = new Set();
let playlists = [];
let downloaded = new Set();

const AVATAR_COLORS=['#1ed760','#ffb32b','#4fc3f7','#ef6eae','#b39ddb','#ff8a65','#4db6ac','#aed581'];
function userKey(base,id){return base+'-'+id;}
function avatarColor(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))>>>0;return AVATAR_COLORS[h%AVATAR_COLORS.length];}

function saveLikes(){localStorage.setItem(userKey('mymusic-liked',currentUserId),JSON.stringify([...liked]));}
function savePlaylists(){localStorage.setItem(userKey('mymusic-playlists',currentUserId),JSON.stringify(playlists));}
function saveDownloads(){localStorage.setItem(userKey('mymusic-downloaded',currentUserId),JSON.stringify([...downloaded]));}

function initUsers(){
  if(!users.length){
    const u={id:'u_'+makeId(),name:'Prashes',createdAt:Date.now()};
    users.push(u);
    localStorage.setItem('mymusic-users',JSON.stringify(users));
    localStorage.setItem(userKey('mymusic-liked',u.id),localStorage.getItem('mymusic-liked')||'[]');
    localStorage.setItem(userKey('mymusic-playlists',u.id),localStorage.getItem('mymusic-playlists')||'[]');
    localStorage.setItem(userKey('mymusic-downloaded',u.id),localStorage.getItem('mymusic-downloaded')||'[]');
  }
  if(!currentUserId||!users.some(u=>u.id===currentUserId)){
    currentUserId=users[0].id;
    localStorage.setItem('mymusic-current-user',currentUserId);
  }
}

function loadUserData(){
  liked=new Set(JSON.parse(localStorage.getItem(userKey('mymusic-liked',currentUserId))||'[]'));
  playlists=JSON.parse(localStorage.getItem(userKey('mymusic-playlists',currentUserId))||'[]');
  downloaded=new Set(JSON.parse(localStorage.getItem(userKey('mymusic-downloaded',currentUserId))||'[]'));
}

function toast(message){
  $('toast').textContent=message;
  $('toast').style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('toast').style.display='none',2500);
}

function escapeHTML(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function makeId(){
  return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
}

function placeholderArt(title='Music'){
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><defs><linearGradient id="g"><stop stop-color="#693852"/><stop offset="1" stop-color="#171014"/></linearGradient></defs><rect width="100%" height="100%" rx="28" fill="url(#g)"/><text x="50%" y="48%" font-size="145" text-anchor="middle" fill="#ffd9f0">♫</text><text x="50%" y="80%" font-family="Arial" font-size="25" text-anchor="middle" fill="white">${String(title).replace(/[<&>]/g,'').slice(0,28)}</text></svg>`
  );
}

function art(song){const a=song?.artwork;return (a&&/^https?:/i.test(a))?a:placeholderArt(song?.title||'Music');}
function currentSong(){return songs.find(s=>s.id===currentId)||null;}
function formatTime(n){return Number.isFinite(n)&&n>=0?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';}

function openDB(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains('audio'))request.result.createObjectStore('audio',{keyPath:'id'});
    };
    request.onsuccess=()=>{db=request.result;resolve(db);};
    request.onerror=()=>reject(request.error);
  });
}

function storeAudio(mode,operation){
  return new Promise((resolve,reject)=>{
    if(!db){reject(new Error('Offline storage unavailable'));return;}
    const tx=db.transaction('audio',mode);
    const request=operation(tx.objectStore('audio'));
    tx.oncomplete=()=>resolve(request?.result);
    tx.onerror=()=>reject(tx.error);
  });
}

async function getOfflineBlob(id){
  return new Promise((resolve,reject)=>{
    if(!db){resolve(null);return;}
    const tx=db.transaction('audio','readonly');
    const request=tx.objectStore('audio').get(id);
    request.onsuccess=()=>resolve(request.result?.blob||null);
    request.onerror=()=>reject(request.error);
  });
}

async function offlineUrl(song){
  const blob=await getOfflineBlob(song.id);
  if(!blob)return null;
  if(objectUrls.has(song.id))return objectUrls.get(song.id);
  const url=URL.createObjectURL(blob);
  objectUrls.set(song.id,url);
  return url;
}

async function loadOfflineSongs(){
  if(!db)return;
  const items=await new Promise((resolve,reject)=>{
    const tx=db.transaction('audio','readonly');
    const req=tx.objectStore('audio').getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });
  items.forEach(item=>{
    downloaded.add(item.id);
    const existing=songs.find(s=>s.id===item.id);
    if(existing)existing.offline=true;
    else songs.push({...item.song,offline:true});
  });
  saveDownloads();
}

function setView(view,playlistId=null){
  currentView=view;
  activePlaylist=view==='playlists'?playlistId:null;
  activeAlbum=view==='albums'?playlistId:null;
  document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view));
  document.querySelectorAll('nav button').forEach(el=>{
    if(el.dataset.view)el.classList.toggle('active',el.dataset.view===view);
  });
  render();
}

function matches(song,q){
  q=(q||'').trim().toLowerCase();
  return !q||(song.title+' '+song.artist+' '+(song.album||'')).toLowerCase().includes(q);
}

function getVisibleSongs(){
  let list=songs.filter(s=>matches(s,$('search').value));
  if(currentView==='liked')list=list.filter(s=>liked.has(s.id));
  if(currentView==='offline')list=list.filter(s=>downloaded.has(s.id)||s.offline);
  if(currentView==='albums')list=list.filter(s=>albumKey(s)===activeAlbum);
  if(currentView==='playlists'){
    const playlist=playlists.find(p=>p.id===activePlaylist);
    list=playlist?playlist.songIds.map(id=>songs.find(s=>s.id===id)).filter(Boolean).filter(s=>matches(s,$('search').value)):[];
  }
  return list;
}

const SITE_JUNK=/(www\.\S+|freshmaza|downloadming|pagalworld|pagalsong|djyoungster|mr-jatt|jatt\.fm|wapking|djmaza|songs\.pk|webmusic|musica\.in|skmedia|riser)/ig;

function escapeRegExp(t){return String(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function cleanAlbumText(t){
  return String(t)
    .replace(/\b\d{2,3}\s*kbps\b/ig,' ')
    .replace(/www\.[^\s\)\]]+/ig,' ')
    .replace(/\b(full\s+)?(video|audio)\s+song(s)?\b/ig,' ')
    .replace(/\bfull\s+song\b/ig,' ')
    .replace(/\blyrical\s+video\b/ig,' ')
    .replace(SITE_JUNK,' ')
    .replace(/\.\s*(com|in|net|org|pk|info)\b/ig,' ')
    .replace(/[\[\]\(\)\{\}\|]/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .replace(/^[-–—:.\s]+/,'')
    .replace(/[-–—:\s]+$/,'');
}

function detectAlbumInfo(raw){
  let name=String(raw||'').replace(/\.[^.]+$/,'');
  name=name.replace(/\b\d{2,3}\s*kbps\b/ig,' ').replace(/www\.[^\s\)\]]+/ig,' ').replace(SITE_JUNK,' ').replace(/\.\s*(com|in|net|org|pk|info)\b/ig,' ').replace(/\[\s*\]/g,' ').replace(/\(\s*\)/g,' ').replace(/\s+/g,' ').trim();
  let track=null;
  const lead=name.match(/^(\d{1,3})[\s.\-_]+(.+)$/);
  if(lead){track=+lead[1];name=lead[2].trim();}
  const segs=name.split(/\s+[-–—]\s+/).map(s=>s.trim()).filter(Boolean);
  let album='';
  if(segs.length===2){
    if(/^\d{1,3}$/.test(segs[1])){track=+segs[1];album=cleanAlbumText(segs[0]);}
    else{
      const tb=segs[1].match(/^(\d{1,3})[\s.\-_]+(.+)$/);
      if(tb){track=+tb[1];album=cleanAlbumText(segs[0]);}
      else album=cleanAlbumText(segs[1]);
    }
  }else if(segs.length===3){
    if(/^\d{1,3}$/.test(segs[1])){track=+segs[1];album=cleanAlbumText(segs[0]);}
    else album=cleanAlbumText(segs[2]);
  }else if(segs.length===1){
    const m=segs[0].match(/[\(\[]([^\)\]]{2,60})[\)\]]/);
    if(m)album=cleanAlbumText(m[1]);
  }
  let title=name;
  if(album){
    try{
      title=title.replace(new RegExp('[\\s]*[-–—]?[\\s]*'+escapeRegExp(album)+'[\\s]*$','i'),'');
      title=title.replace(new RegExp('^'+escapeRegExp(album)+'[\\s]*[-–—][\\s]*','i'),'');
    }catch(e){}
  }
  if(track!=null)title=title.replace(/^\s*\d{1,3}[\s.\-_]+/,'');
  if(album)title=title.replace(/[\(\[][^\)\]]*[\)\]]/g,' ');
  title=cleanAlbumText(title)||name;
  return {album:album||'',track:track,cleanTitle:title};
}

function applyAlbums(){
  songs.forEach(s=>{
    if(!s.originalTitle)s.originalTitle=s.title;
    const info=detectAlbumInfo(s.originalTitle);
    s.album=info.album;
    s.trackNo=info.track;
    s.title=info.cleanTitle||s.originalTitle;
  });
}

function albumKey(s){return (s.album||'').trim().toLowerCase()||'__unknown__';}

function getAlbums(){
  const map=new Map();
  songs.forEach(s=>{
    const k=albumKey(s);
    if(!map.has(k))map.set(k,{key:k,name:s.album||'Unknown Album',songs:[]});
    map.get(k).songs.push(s);
  });
  const list=[...map.values()];
  list.forEach(a=>a.songs.sort((x,y)=>((x.trackNo??999)-(y.trackNo??999))||String(x.title).localeCompare(String(y.title))));
  list.sort((a,b)=>a.name.localeCompare(b.name));
  return list;
}

function updateNow(){
  const song=currentSong();
  if(!song)return;
  $('nowCover').src=art(song);

  $('nowArtist').textContent=song.artist||'Unknown artist';

async function playSong(id){
  const song=songs.find(s=>s.id===id);
  if(!song)return;
  if(room.mode==='guest'){
    if(room.hostConn&&room.hostConn.open){room.hostConn.send({t:'play-req',songId:id});toast('Song requested 🎶');}
    else toast('Not connected to the room.');
    return;
  }
  currentId=id;
  if(!queue.length)queue=songs.slice();
  const index=queue.findIndex(s=>s.id===id);
  if(index>=0)queueIndex=index;
  try{
    let source=song.url;
    if(downloaded.has(id)){
      const saved=await offlineUrl(song);
      if(saved)source=saved;
    }
    if(!source){toast('No audio source found.');return;}
    audio.src=source;
    updateNow();
    await audio.play();
    updateNow();
  }catch(error){
    toast('Unable to play this song. Check the file or connection.');
    updateNow();
  }
}

function togglePlayback(){
  if(room.mode==='guest'){guestCtl('toggle');return;}
  if(!currentSong()){toast('Choose a song first.');return;}
  if(audio.paused)audio.play().then(updateNow).catch(()=>toast('Playback failed.'));
  else{audio.pause();updateNow();}
}

function nextSong(direction=1){
  if(room.mode==='guest'){guestCtl(direction<0?'prev':'next');return;}
  if(!queue.length)queue=songs.slice();
  if(!queue.length)return;
  if(shuffle&&queue.length>1){
    let next=queueIndex;
    while(next===queueIndex)next=Math.floor(Math.random()*queue.length);
    queueIndex=next;
  }else{
    queueIndex=(queueIndex+direction+queue.length)%queue.length;
  }
  playSong(queue[queueIndex].id);
}

function openPlaylistDialog(id=null){
  playlistEditId=id;

function updateUserBtn(){

function renderUserDialog(){
  $('userList').innerHTML=users.map(u=>`
    <div class="row">
      <span class="avatar" style="background:${avatarColor(u.name)};cursor:pointer" data-user="${u.id}">${escapeHTML(([...u.name][0]||'?').toUpperCase())}</span>

function switchUser(id){
  if(!users.some(u=>u.id===id))return;
  if(id===currentUserId){$('userDialog').close();return;}
  currentUserId=id;
  localStorage.setItem('mymusic-current-user',currentUserId);

  updateUserBtn();

function deleteUser(id){
  const u=users.find(x=>x.id===id);
  if(!u||!confirm('Delete user "'+u.name+'" with their likes, playlists and downloads?'))return;
  users=users.filter(x=>x.id!==id);
  localStorage.setItem('mymusic-users',JSON.stringify(users));
  [userKey('mymusic-liked',id),userKey('mymusic-playlists',id),userKey('mymusic-downloaded',id)].forEach(k=>localStorage.removeItem(k));
  if(id===currentUserId&&users.length){
    currentUserId=users[0].id;
    localStorage.setItem('mymusic-current-user',currentUserId);
    loadUserData();
  }
  renderUserDialog();
  updateUserBtn();
  render();
  updateNow();
  toast('User deleted');
}

/* ───────────── Listen-together rooms (share music live) ───────────── */
const room={mode:null,code:null,peer:null,conns:[],hostConn:null,guests:new Map(),guestList:[],hostName:'',tickTimer:null,pendingPlay:null,playingId:null,lastPos:0};
const fileIncoming=new Map();

let peerLibPromise=null;
function ensurePeer(){
  if(window.Peer)return Promise.resolve();
  if(!peerLibPromise){
    peerLibPromise=new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
      s.onload=resolve;
      s.onerror=()=>{peerLibPromise=null;reject(new Error('peerjs-load-failed'));};
      document.head.appendChild(s);
    });
  }
  return peerLibPromise;
}

function genRoomCode(){
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';
  for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];
  return c;
}

function roomBroadcast(msg){room.conns.forEach(c=>{try{if(c.open)c.send(msg);}catch(e){}});}

function guestCtl(action){
  if(room.mode==='guest'&&room.hostConn&&room.hostConn.open){room.hostConn.send({t:'ctl',a:action});return true;}
  return false;
}

function hostUserName(){
  const u=users.find(x=>x.id===currentUserId);
  return u?u.name:'Host';
}

function sharedMeta(s){
  return {id:s.id,title:s.title,artist:s.artist,album:s.album||'',artwork:s.artwork||null,url:(s.url&&!s.file)?s.url:null,sourceType:s.sourceType||'drive',needsFile:!!(s.file||s.blob)};
}

function sendRoomState(conn){
  conn.send({t:'state',songs:songs.map(sharedMeta),guests:[...room.guests.values()],code:room.code,host:hostUserName()});
}

function updateRoomChip(){
  const p=document.querySelector('header p');
  if(!p)return;
  if(!room.mode){p.textContent='Your music, wherever you go.';return;}
  if(room.mode==='host')p.textContent='🎙 Room '+room.code+' · '+room.conns.length+' listener'+(room.conns.length===1?'':'s');
  else p.textContent='🎙 In room '+room.code+' · listening together';
}

function initialOf(name){return escapeHTML(([...String(name||'?')][0]||'?').toUpperCase());}

async function createRoom(tries){
  tries=tries||0;
  if(room.mode){toast('Leave the current room first.');return;}
  try{await ensurePeer();}catch(e){toast('Could not start sharing. Check internet.');return;}
  let peer;
  try{peer=new Peer('mprsh-'+genRoomCode().toLowerCase());}
  catch(e){toast('Sharing is not supported in this browser.');return;}
  toast('Creating room…');
  peer.on('open',()=>{
    room.mode='host';
    room.code=peer.id.replace('mprsh-','').toUpperCase();
    room.peer=peer;room.conns=[];room.guests=new Map();room.guestList=[];
    clearInterval(room.tickTimer);
    room.tickTimer=setInterval(()=>{
      const s=currentSong();
      roomBroadcast({t:'tick',songId:s?s.id:null,pos:audio.currentTime||0,playing:!audio.paused});
    },3000);
    updateRoomChip();
    if(currentView==='share')render();
    toast('Room created! Code: '+room.code);
  });
  peer.on('connection',conn=>{
    conn.on('open',()=>{
      conn.send({t:'welcome',code:room.code,host:hostUserName()});
      sendRoomState(conn);
      const s=currentSong();
      if(s)conn.send({t:'play',songId:s.id,pos:audio.currentTime||0,playing:!audio.paused});
    });
    conn.on('data',d=>hostOnData(conn,d));
    conn.on('close',()=>hostGuestLeft(conn));
    conn.on('error',()=>hostGuestLeft(conn));
    room.conns.push(conn);
  });
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('error',err=>{
    if(err&&err.type==='unavailable-id'&&tries<3){createRoom(tries+1);return;}
    if(err&&err.type!=='peer-unavailable')toast('Room error: '+(err.type||'unknown'));
  });
}

function hostOnData(conn,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='hello'){
    const name=String(d.name||'Guest').slice(0,20);
    room.guests.set(conn.peer,name);
    roomBroadcast({t:'guests',list:[...room.guests.values()]});
    updateRoomChip();
    if(currentView==='share')render();
    toast(name+' joined the room 🎉');
  }else if(d.t==='play-req'){
    playSong(d.songId);
  }else if(d.t==='ctl'){
    if(d.a==='toggle')togglePlayback();
    else if(d.a==='next')nextSong(1);
    else if(d.a==='prev')nextSong(-1);
  }else if(d.t==='seek'){
    if(Number.isFinite(d.pos)){audio.currentTime=d.pos;roomBroadcast({t:'seek',pos:d.pos});}
  }else if(d.t==='need-file'){
    const song=songs.find(s=>s.id===d.songId);
    if(song)sendFileTo(conn,song);
    else conn.send({t:'note',m:'That song is no longer available.'});
  }
}

function hostGuestLeft(conn){
  const known=room.conns.includes(conn);
  room.conns=room.conns.filter(c=>c!==conn);
  const name=room.guests.get(conn.peer);
  room.guests.delete(conn.peer);
  if(known){
    roomBroadcast({t:'guests',list:[...room.guests.values()]});
    if(name)toast(name+' left the room');
    updateRoomChip();
    if(currentView==='share')render();
  }
}

async function joinRoom(codeRaw){
  const code=String(codeRaw||'').trim().toUpperCase();
  if(room.mode){toast('Leave the current room first.');return;}
  if(code.length<4){toast('Enter a valid room code.');return;}
  try{await ensurePeer();}catch(e){toast('Could not start sharing. Check internet.');return;}
  let name=localStorage.getItem('mymusic-nickname')||'';
  if(!name){
    name=prompt('Your name in the room:','Guest')||'Guest';
  }
  name=String(name).slice(0,20);
  localStorage.setItem('mymusic-nickname',name);
  let peer;
  try{peer=new Peer();}catch(e){toast('Sharing is not supported in this browser.');return;}
  toast('Joining room '+code+'…');
  room.mode='guest';room.code=code;room.peer=peer;
  let opened=false;
  peer.on('open',()=>{
    const conn=peer.connect('mprsh-'+code.toLowerCase(),{reliable:true});
    room.hostConn=conn;
    conn.on('open',()=>{
      opened=true;
      conn.send({t:'hello',name});
      updateRoomChip();
      if(currentView==='share')render();
      toast('Joined room '+code+' 🎉');
    });
    conn.on('data',d=>guestOnData(d));
    conn.on('close',()=>{if(room.mode==='guest'){toast('The host closed the room.');leaveRoom(true);}});
    setTimeout(()=>{if(!opened&&room.mode==='guest'){toast('Could not reach room '+code+'. Check the code.');leaveRoom(true);}},12000);
  });
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('error',err=>{
    if(err&&err.type==='peer-unavailable')toast('Room '+code+' not found.');
    else if(err&&err.type!=='unload')toast('Room error: '+(err.type||'unknown'));
    if(room.mode==='guest')leaveRoom(true);
  });
}

function guestOnData(d){
  if(!d||typeof d!=='object')return;
  if(d.t==='welcome'){room.hostName=d.host||'Host';if(currentView==='share')render();return;}
  if(d.t==='state'){room.hostName=d.host||room.hostName;mergeSharedSongs(d.songs||[]);room.guestList=d.guests||[];render();return;}
  if(d.t==='guests'){room.guestList=d.list||[];if(currentView==='share')render();return;}
  if(d.t==='play'){guestPlay(d);return;}
  if(d.t==='pause'){
    room.lastPos=d.pos||0;
    if(!audio.paused)audio.pause();
    if(Number.isFinite(d.pos)){try{audio.currentTime=d.pos;}catch(e){}}
    updateNow();return;
  }
  if(d.t==='seek'){if(Number.isFinite(d.pos)){try{audio.currentTime=d.pos;}catch(e){}}return;}
  if(d.t==='tick'){guestTick(d);return;}
  if(d.t==='fstart'){guestFileStart(d);return;}
  if(d.t==='fchunk'){guestFileChunk(d);return;}
  if(d.t==='fend'){guestFileEnd(d);return;}
  if(d.t==='note'){toast(d.m||'Host: update received');return;}
  if(d.t==='room-end'){toast('The host ended the room.');leaveRoom(true);return;}
}

function mergeSharedSongs(list){
  list.forEach(m=>{
    if(!m||!m.id)return;
    const ex=songs.find(s=>s.id===m.id);
    if(ex){
      ex.title=m.title||ex.title;
      ex.artist=m.artist||ex.artist;
      ex.album=m.album||'';
      if(m.artwork)ex.artwork=m.artwork;
      if(m.url&&!(ex.file||ex.blob))ex.url=m.url;
      ex.needsFile=!!m.needsFile&&!(ex.file||ex.blob);
      ex.shared=true;
    }else{
      songs.push({...m,shared:true,needsFile:!!m.needsFile});
    }
  });
}

function guestPlay(d){
  const song=songs.find(s=>s.id===d.songId);
  if(!song)return;
  room.lastPos=d.pos||0;
  currentId=song.id;
  const shouldPlay=d.playing!==false;
  if(song.needsFile&&!(song.file||song.blob)){
    room.pendingPlay=song.id;
    if(room.hostConn&&room.hostConn.open)room.hostConn.send({t:'need-file',songId:song.id});
    updateNow();
    toast('Receiving "'+song.title+'"…');
    return;
  }
  if(room.playingId===song.id&&audio.src){
    if(Number.isFinite(d.pos)){try{audio.currentTime=d.pos;}catch(e){}}
    if(shouldPlay)audio.play().catch(()=>toast('Tap ⏵ once to join the music'));
    else audio.pause();
    updateNow();return;
  }
  let src=song.url;
  if(song.file)src=URL.createObjectURL(song.file);
  else if(song.blob)src=URL.createObjectURL(song.blob);
  if(!src){toast('No audio source for this song yet.');return;}
  room.playingId=song.id;
  audio.src=src;
  const onMeta=()=>{try{audio.currentTime=d.pos||0;}catch(e){}audio.removeEventListener('loadedmetadata',onMeta);};
  audio.addEventListener('loadedmetadata',onMeta);
  if(shouldPlay)audio.play().catch(()=>toast('Tap ⏵ once to join the music'));
  updateNow();
}

function guestTick(d){
  room.lastPos=d.pos||0;
  if(d.songId){
    const s=currentSong();
    if(!s||s.id!==d.songId){if(d.playing)guestPlay(d);return;}
  }
  if(d.playing&&audio.paused)audio.play().catch(()=>{});
  if(!d.playing&&!audio.paused)audio.pause();
  if(d.playing&&audio.src&&Number.isFinite(d.pos)&&Math.abs(audio.currentTime-d.pos)>1.5){try{audio.currentTime=d.pos;}catch(e){}}
}

function bufToB64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function b64ToU8(b){const s=atob(b);const u8=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u8[i]=s.charCodeAt(i);return u8;}

async function sendFileTo(conn,song){
  const blob=(song.file instanceof File)?song.file:(song.blob||null);
  if(!blob){conn.send({t:'note',m:'No file available for '+song.title});return;}
  if(blob.size>25*1024*1024){conn.send({t:'note',m:'"'+song.title+'" is too large to send (25MB limit).'});return;}
  try{
    conn.send({t:'fstart',id:song.id,title:song.title,artist:song.artist,album:song.album||'',artwork:song.artwork||null,size:blob.size});
    const CH=60000;let seq=0;
    for(let off=0;off<blob.size;off+=CH){
      const u8=new Uint8Array(await blob.slice(off,off+CH).arrayBuffer());
      conn.send({t:'fchunk',id:song.id,seq:seq++,data:bufToB64(u8)});
      if(seq%8===0)await new Promise(r=>setTimeout(r));
    }
    conn.send({t:'fend',id:song.id});
  }catch(e){conn.send({t:'note',m:'Failed to send '+song.title});}
}

function guestFileStart(d){
  fileIncoming.set(d.id,{meta:d,parts:[],size:d.size||0,got:0});
  toast('Receiving "'+d.title+'"…');
}
function guestFileChunk(d){
  const f=fileIncoming.get(d.id);if(!f)return;
  const u8=b64ToU8(d.data);
  f.parts.push(u8);f.got+=u8.length;
  if(f.size&&f.got>f.size*1.4)fileIncoming.delete(d.id);
}
function guestFileEnd(d){
  const f=fileIncoming.get(d.id);if(!f)return;
  fileIncoming.delete(d.id);
  const blob=new Blob(f.parts,{type:'audio/mpeg'});
  const song=songs.find(s=>s.id===d.id);
  if(song){song.blob=blob;song.needsFile=false;}
  toast('Received "'+(f.meta.title||'audio')+'" ✓');
  if(room.pendingPlay===d.id){
    room.pendingPlay=null;
    if(song)guestPlay({songId:d.id,pos:room.lastPos,playing:true});
  }
}

function leaveRoom(silent){
  const was=room.mode;
  try{if(was==='host')roomBroadcast({t:'room-end'});}catch(e){}
  room.conns.forEach(c=>{try{c.close();}catch(e){}});
  try{if(room.peer)room.peer.destroy();}catch(e){}
  clearInterval(room.tickTimer);
  room.mode=null;room.code=null;room.peer=null;room.conns=[];room.hostConn=null;
  room.guests=new Map();room.guestList=[];room.hostName='';room.pendingPlay=null;room.playingId=null;
  songs=songs.filter(s=>!(s.shared&&s.needsFile&&!(s.blob||s.file)));
  updateRoomChip();
  render();
  if(!silent)toast(was?'Left the room':'');
}

async function inviteShare(){
  const isHttp=location.protocol==='http:'||location.protocol==='https:';

  if(navigator.share){try{await navigator.share({title:'Music By Prashes room',text});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(text);toast('Invite copied — paste it to friends!');}
  catch(e){toast('Room code: '+room.code);}
}

          <form id="joinForm" class="joinrow"><input id="joinCode" placeholder="CODE" maxlength="5" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase"><button type="submit" class="primary" style="border-radius:11px;padding:0 18px">Join</button></form>

function songOptions(id){
  const song=songs.find(s=>s.id===id);
  if(!song)return;
  const action=prompt('Options for '+song.title+':\n1 = Play\n2 = Download\n3 = Add to playlist\n4 = Remove download');
  if(action==='1')playSong(id);
  if(action==='2')downloadSong(id);
  if(action==='3')showAddToPlaylist(id);
  if(action==='4')removeDownload(id);
}

async function downloadSong(id){
  const song=songs.find(s=>s.id===id);
  if(!song)return;
  if(downloaded.has(id)){toast('Already downloaded');return;}
  try{
    toast('Downloading audio…');
    let blob;
    if(song.file instanceof File)blob=song.file;
    else if(song.blob)blob=song.blob;
    else{
      const response=await fetch(song.url);
      if(!response.ok)throw new Error('Download failed');
      blob=await response.blob();
    }
    if(!blob.size)throw new Error('Empty audio');
    await storeAudio('readwrite',store=>store.put({
      id,
      song:{id:song.id,title:song.title,artist:song.artist,artwork:song.artwork,url:song.url,sourceType:song.sourceType,originalTitle:song.originalTitle,album:song.album,trackNo:song.trackNo},
      blob
    }));
    downloaded.add(id);
    song.offline=true;
    saveDownloads();
    render();
    updateNow();
    toast('Saved for offline playback');
  }catch(error){
    toast('Download failed. This source may block offline downloads.');
  }
}

async function removeDownload(id){
  try{
    await storeAudio('readwrite',store=>store.delete(id));
    downloaded.delete(id);
    saveDownloads();
    if(objectUrls.has(id)){
      URL.revokeObjectURL(objectUrls.get(id));
      objectUrls.delete(id);
    }
    const song=songs.find(s=>s.id===id);
    if(song)song.offline=false;
    render();
    updateNow();
    toast('Download removed');
  }catch(error){toast('Could not remove download');}
}

async function loadDrive(){
  if(!DRIVE_API_KEY||DRIVE_API_KEY==='PASTE_YOUR_GOOGLE_DRIVE_API_KEY_HERE'){
    toast('Add your Google Drive API key in the HTML first.');
    return;
  }
  $('driveBtn').textContent='Loading…';
  try{
    let token=null,files=[];
    do{
      const params=new URLSearchParams({
        q:`'${DRIVE_FOLDER_ID}' in parents and trashed = false`,
        fields:'nextPageToken,files(id,name,mimeType,thumbnailLink)',
        pageSize:'100',
        key:DRIVE_API_KEY
      });
      if(token)params.set('pageToken',token);
      const response=await fetch('https://www.googleapis.com/drive/v3/files?'+params);
      const data=await response.json();
      if(!response.ok)throw new Error(data.error?.message||'Google Drive request failed');
      files.push(...(data.files||[]));
      token=data.nextPageToken||null;
    }while(token);

    const audioFiles=files.filter(f=>f.mimeType?.startsWith('audio/'));
    const newSongs=audioFiles.map(file=>({
      id:'drive_'+file.id,
      title:file.name.replace(/\.[^.]+$/,''),
      artist:'Google Drive',
      url:'https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media&key='+encodeURIComponent(DRIVE_API_KEY),
      artwork:file.thumbnailLink||placeholderArt(file.name),
      sourceType:'drive',
      driveId:file.id
    }));
    newSongs.forEach(ns=>{
      const ex=songs.find(s=>s.id===ns.id);
      if(ex){ex.title=ns.title;ex.artwork=ns.artwork;ex.url=ns.url;ex.originalTitle=ns.title;delete ex.album;}
      else songs.push(ns);
    });
    applyAlbums();
    queue=songs.slice();
    if(room.mode==='host')room.conns.forEach(sendRoomState);
    render();
    toast('Loaded '+audioFiles.length+' audio files');
  }catch(error){
    toast('Drive error: '+error.message);
  }finally{
    $('driveBtn').textContent='Load Drive';
  }
}

function importFiles(files){
  let count=0;
  for(const file of files){
    if(!file.type.startsWith('audio/'))continue;
    const id='local_'+makeId();
    songs.push({
      id,
      title:file.name.replace(/\.[^.]+$/,''),
      artist:'On this device',
      url:URL.createObjectURL(file),
      file,
      sourceType:'local',
      artwork:placeholderArt(file.name)
    });
    count++;
  }
  applyAlbums();
  queue=songs.slice();
  if(room.mode==='host')room.conns.forEach(sendRoomState);
  render();
  toast('Imported '+count+' audio file(s)');
}

$('playlistForm').addEventListener('submit',event=>{
  event.preventDefault();
  const name=$('playlistName').value.trim();
  if(!name)return;
  const editing=playlistEditId;
  if(editing){
    const pl=playlists.find(p=>p.id===editing);
    if(pl)pl.name=name;
  }else{
    playlists.push({id:'pl_'+makeId(),name,songIds:[]});
  }
  savePlaylists();
  $('playlistDialog').close();
  playlistEditId=null;
  render();
  toast(editing?'Playlist renamed':'Playlist created');
});

};

$('nowLike').onclick=()=>{if(currentId)toggleLike(currentId);};

$('shuffleBtn').onclick=()=>{
  shuffle=!shuffle;
  $('shuffleBtn').classList.toggle('liked',shuffle);
  toast(shuffle?'Shuffle on':'Shuffle off');
};

  repeat=!repeat;
  audio.loop=repeat;
  $('repeatBtn').classList.toggle('liked',repeat);

};

$('downloadBtn').onclick=()=>currentId&&downloadSong(currentId);
$('nowMore').onclick=()=>currentId&&songOptions(currentId);

$('queueBtn').onclick=()=>{
  const upcoming=queue.slice(Math.max(0,queueIndex));
  alert('Queue\n\n'+(upcoming.map((s,i)=>(i+1)+'. '+s.title).join('\n')||'No songs in queue'));
};

$('progress').addEventListener('input',()=>{
  if(Number.isFinite(audio.duration)&&audio.duration>0){
    const t=(Number($('progress').value)/1000)*audio.duration;
    if(room.mode==='guest'){if(room.hostConn&&room.hostConn.open)room.hostConn.send({t:'seek',pos:t});return;}
    audio.currentTime=t;
    if(room.mode==='host')roomBroadcast({t:'seek',pos:t});
  }
});

audio.addEventListener('timeupdate',()=>{
  if(Number.isFinite(audio.duration)&&audio.duration>0){
    $('progress').value=Math.round(audio.currentTime/audio.duration*1000);
  }
  $('currentTime').textContent=formatTime(audio.currentTime);
  $('duration').textContent=formatTime(audio.duration);
});
audio.addEventListener('loadedmetadata',()=>{$('duration').textContent=formatTime(audio.duration);});
audio.addEventListener('play',()=>{updateNow();if(room.mode==='host')roomBroadcast({t:'play',songId:currentId,pos:audio.currentTime||0,playing:true});});
audio.addEventListener('pause',()=>{updateNow();if(room.mode==='host')roomBroadcast({t:'pause',pos:audio.currentTime||0});});
audio.addEventListener('ended',()=>{if(room.mode!=='guest'&&!repeat)nextSong(1);});
audio.addEventListener('error',()=>{
  if(currentSong())toast('Unable to play audio. Check internet or file access.');
});

function setupMediaSession(){
  if(!('mediaSession' in navigator))return;
  try{navigator.mediaSession.setActionHandler('play',()=>audio.play().catch(()=>{}));}catch(e){}
  try{navigator.mediaSession.setActionHandler('pause',()=>audio.pause());}catch(e){}
  try{navigator.mediaSession.setActionHandler('previoustrack',()=>nextSong(-1));}catch(e){}
  try{navigator.mediaSession.setActionHandler('nexttrack',()=>nextSong(1));}catch(e){}
  try{navigator.mediaSession.setActionHandler('seekto',d=>{if(d&&d.seekTime!=null&&Number.isFinite(d.seekTime))audio.currentTime=d.seekTime;});}catch(e){}
  try{navigator.mediaSession.setActionHandler('stop',()=>audio.pause());}catch(e){}
}

(async()=>{
  setupMediaSession();
  initUsers();
  loadUserData();
  try{
    await openDB();
    await loadOfflineSongs();
  }catch(error){
    console.warn('Offline storage unavailable',error);
  }
  applyAlbums();
  queue=songs.slice();
  render();
  updateUserBtn();
  const roomParam=(location.search.match(/[?&]room=([A-Za-z0-9]+)/)||[])[1];
  if(roomParam){
    setView('share');
    setTimeout(()=>{if($('joinCode'))$('joinCode').value=roomParam.toUpperCase();joinRoom(roomParam.toUpperCase());},600);
  }
})();
